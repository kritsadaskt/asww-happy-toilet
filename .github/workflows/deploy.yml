name: PROD - Deploy to AWS Lightsail

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Deploy to PROD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Lightsail
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST_PROD }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "🚀 Starting deployment..."
            
            # Navigate to app directory
            cd /home/ubuntu/asww-happy-toilet
            
            # Pull latest changes
            echo "📥 Pulling latest code..."
            git pull origin master
            
            # Create/update .env.local file with environment variables
            echo "🔐 Configuring environment variables..."
            cat > .env.local << ENVFILE
            HT_REGION=${{ secrets.HT_REGION }}
            HT_ACCESS_KEY_ID=${{ secrets.HT_ACCESS_KEY_ID }}
            HT_SECRET_ACCESS_KEY=${{ secrets.HT_SECRET_ACCESS_KEY }}
            HT_S3_BUCKET_NAME=${{ secrets.HT_S3_BUCKET_NAME }}
            HT_DYNAMODB_TABLE=${{ secrets.HT_DYNAMODB_TABLE }}
            HT_EMAIL_ADDR=${{ secrets.HT_EMAIL_ADDR }}
            HT_EMAIL_PWD=${{ secrets.HT_EMAIL_PWD }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            ENVFILE
            
            # Install dependencies
            echo "📦 Installing dependencies..."
            npm install
            
            # Build the application
            echo "🔨 Building application..."
            npm run build
            
            # Restart PM2
            echo "♻️ Restarting application..."
            export PM2_HOME=/home/ubuntu/.pm2
            pm2 restart all --update-env
            
            # Show status
            echo "✅ Deployment complete!"
            pm2 status